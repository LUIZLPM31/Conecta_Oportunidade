spring.application.name=conecta-oportunidades

# --- Banco de Dados (MySQL — TiDB Serverless) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:test}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Servidor ---
server.port=8080

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://conecta-oportunidades.vercel.app,http://localhost:5173,http://localhost:3000}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.com.conectaoportunidades=INFO
logging.level.org.springframework.security=WARN

